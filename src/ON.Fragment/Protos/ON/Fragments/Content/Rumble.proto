syntax = "proto3";

package ON.Fragments.Content;
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

service RumbleInterface {
	rpc GetRumbleChannel (RumbleChannelRequest) returns (RumbleChannelResponse);		// Grab a Rumble Channel	 (Rumble API Method: Media.Search)
	rpc GetRumbleVideo (RumbleVideoRequest) returns (RumbleVideoResponse);				// Grab a Rumble Channel	 (Rumble API Method: Media.Item)
	rpc GetAllStoredData (EmptyRequest) returns (StoredDataResponse);
	rpc GetStoredDataById (StoredDataRequest) returns (StoredDataResponse);
}

message RumbleVideo {
	string Id = 1;
	string Embed = 2;
	string Title = 3;
	bool IsPrivate = 4;
	string Channel = 5;
	string UploadDate = 6;
}

message EmptyRequest {}

message StoredDataRequest {
	string VideoId = 1;
}

message StoredDataResponse {
	bool Success = 1;
	string Msg = 2;
	string Error = 3;
	RumbleData Data = 4;
}

message RumbleData {
	repeated RumbleVideo Videos = 1;
}

message RumbleVideoRequest {
	string VideoId = 1;
}

message RumbleVideoResponse {
	bool Success = 1;
	string Msg = 2;
	string Error = 3;
	RumbleVideo Video = 4;
}

message DateFilter {
	string BeginDate = 1;
	string EndDate = 2;
}

message RumbleChannelRequest {
	string ChannelId = 1;
	DateFilter dates = 2;
}

message RumbleChannelResponse {
	bool Success = 1;
	string Msg = 2;
	string Error = 3;
	RumbleData Data = 4;
}

// Rumble Livestreams
service RumbleLivestreamInterface {
	rpc GetLivestream(RumbleLivestreamRequest) returns (RumbleLivestreamResponse);
}

message RumbleFollowerRecord {
	string Username = 1;
	string FollowedOn = 2;
}

message RumbleLivestreamFollowerData {
	uint32 NumFollowers = 1;
	uint32 NumFollowersTotal = 2;
	RumbleFollowerRecord LatestFollower = 3;
	repeated RumbleFollowerRecord RecentFollowers = 4;
}

message RumbleSubscriberRecord {
	string Username = 1;
	string User = 2;
	uint32 AmountCents = 3;
	uint32 AmountDollars = 4;
	string SubscribedOn = 5;
}

message RumbleLivestreamSubscriberData {
	uint32 NumSubscribers = 1;
	RumbleSubscriberRecord LatestSubscriber = 2;
	repeated RumbleSubscriberRecord RecentSubscribers = 3;
}

message RumbleLivestreamCategory {
	string Slug = 1;
	string Title = 2;
}

message RumbleLivestreamCategoryData {
	RumbleLivestreamCategory Primary = 1;
	RumbleLivestreamCategory Secondary = 2;
}

message RumbleLivestreamChatRecord {
	string Username = 1;
	repeated string Badges = 2;
	string Text = 3;
	string CreatedOn = 4;
}

message RumbleLivestreamRantRecord {
	string Username = 1;
	repeated string Badges = 2;
	string Text = 3;
	string CreatedOn = 4;
	string ExpiresOn = 5;
	uint32 AmountCents = 6;
	uint32 AmountDollars = 7;
}

message RumbleLivestreamChatData {
	RumbleLivestreamChatRecord LatestMessage = 1;
	repeated RumbleLivestreamChatRecord RecentMessages = 2;
	RumbleLivestreamRantRecord LatestRant = 3;
	repeated RumbleLivestreamRantRecord RecentRants = 4;
}

message RumbleLivestreamRecord {
	string Id = 1;
	string Title = 2;
	string CreatedOn = 3;
	bool IsLive = 4;
	RumbleLivestreamCategoryData Categories = 5;
	string StreamKey = 6;
	uint32 Likes = 7;
	uint32 Dislikes = 8;
	uint32 WatchingNow = 9;
	RumbleLivestreamChatData Chat = 10;
}

message RumbleLivestreamRequest {
	uint32 MaxNumResults = 1;
}

message RumbleLivestreamResponse {
	uint32 Now = 1;
	string Type = 2;
	string UserId = 3;
	string ChannelId = 4;
	string Since = 5;
	uint32 MaxNumResults = 6;
	RumbleLivestreamFollowerData Followers = 7;
	RumbleLivestreamSubscriberData Subscribers = 8;
	repeated RumbleLivestreamRantRecord Livestreams = 9;
}

message RumbleLivestreamChannelRecord {
	string ChannelId = 1;
	string ApiUrl = 2;
}